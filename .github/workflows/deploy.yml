# =============================================================================
# Deployment Pipeline — Sentry Vision AI Security System
# =============================================================================
# Builds and pushes the Docker image to DockerHub on merge to main.
# Requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets.
# =============================================================================

name: Deploy to Production

on:
  push:
    branches: [main]

  # Allow manual deployment from any branch
  workflow_dispatch:

# Only one deployment at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false   # Don't cancel active deployments

env:
  IMAGE_NAME: sentry-vision-ai-security-system

jobs:
  # ─────────────────────────────────────────────
  # 1. Pre-flight — Quick sanity check before deploy
  # ─────────────────────────────────────────────
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libespeak1 ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run critical tests
        run: |
          python -m pytest tests/ \
            --verbose \
            --tb=short \
            -x   # Stop on first failure

      - name: Verify Dockerfile exists
        run: |
          if [ ! -f Dockerfile ]; then
            echo "::error::Dockerfile not found in project root."
            exit 1
          fi
          echo "Dockerfile found ✓"

  # ─────────────────────────────────────────────
  # 2. Build & Push — Docker image to registry
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Docker Buildx for advanced build features (caching, multi-platform)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate with DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Generate image metadata (tags, labels)
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with "latest" for default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with short SHA for traceability
            type=sha,prefix=,format=short
            # Tag with date for rollback reference
            type=raw,value={{date 'YYYYMMDD'}},enable={{is_default_branch}}

      # Build and push the image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Print the pushed image details
      - name: Image push summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.meta.outputs.tags }}' | tr ',' '\n' | while read tag; do
            echo "- \`$tag\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────
  # 3. Deploy — Simulate production deployment
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production    # Requires environment approval if configured

    steps:
      - name: Deploy notification
        run: |
          echo "========================================="
          echo " PRODUCTION DEPLOYMENT"
          echo "========================================="
          echo " Image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
          echo " Commit: ${{ github.sha }}"
          echo " Actor:  ${{ github.actor }}"
          echo " Time:   $(date -u)"
          echo "========================================="

      # ──────────────────────────────────────────
      # Replace the step below with your actual
      # deployment command (e.g., SSH, kubectl, etc.)
      # ──────────────────────────────────────────
      - name: Simulate deployment
        run: |
          echo "Pulling latest image..."
          echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
          echo ""
          echo "Starting container..."
          echo "docker run -d -p 8000:8000 -p 8501:8501 ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
          echo ""
          echo "✅ Deployment simulation complete."
          echo "Replace this step with actual deployment commands:"
          echo "  - SSH to server and docker pull/restart"
          echo "  - kubectl apply for Kubernetes"
          echo "  - AWS ECS update-service"
          echo "  - Cloud Run deploy"

      - name: Post-deployment summary
        run: |
          echo "## ✅ Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Deployed" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
