# =============================================================================
# Retraining Pipeline — Sentry Vision AI Security System
# =============================================================================
# Trains a new model, evaluates it, and saves the checkpoint as an artifact.
# Triggered manually or on a weekly schedule (not daily).
# =============================================================================

name: Model Retraining

on:
  # Run every Sunday at 06:00 UTC
  schedule:
    - cron: "0 6 * * 0"

  # Allow manual trigger with configurable parameters
  workflow_dispatch:
    inputs:
      epochs:
        description: "Number of training epochs"
        required: false
        default: "25"
      batch_size:
        description: "Training batch size"
        required: false
        default: "32"
      learning_rate:
        description: "Learning rate"
        required: false
        default: "0.001"

env:
  PYTHON_VERSION: "3.11"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  # ─────────────────────────────────────────────
  # 1. Train — Run the training pipeline
  # ─────────────────────────────────────────────
  train:
    name: Train Model
    runs-on: ubuntu-latest
    timeout-minutes: 120   # Safety limit for long training runs

    steps:
      # ── Checkout ──
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          lfs: true

      # ── Python Setup ──
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # ── System Dependencies ──
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libespeak1 ffmpeg

      # ── Python Dependencies ──
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      # ── Train ──
      - name: Run training script
        run: |
          EPOCHS="${{ github.event.inputs.epochs || '25' }}"
          BATCH="${{ github.event.inputs.batch_size || '32' }}"
          LR="${{ github.event.inputs.learning_rate || '0.001' }}"

          echo "Training with: epochs=$EPOCHS batch_size=$BATCH lr=$LR"
          python scripts/fire_train.py \
            --epochs "$EPOCHS" \
            --batch-size "$BATCH" \
            --lr "$LR" \
            | tee train-results/training_log.txt
        env:
          PYTHONPATH: ${{ github.workspace }}

      # ── Upload Trained Model ──
      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-${{ github.run_id }}
          path: |
            models/*.pth
            models/training_history.png
          retention-days: 90

      # ── Upload Training Log ──
      - name: Upload training log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-log-${{ github.run_id }}
          path: train-results/
          retention-days: 30

  # ─────────────────────────────────────────────
  # 2. Evaluate — Validate the newly trained model
  # ─────────────────────────────────────────────
  evaluate:
    name: Evaluate New Model
    runs-on: ubuntu-latest
    needs: train

    steps:
      # ── Checkout ──
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          lfs: true

      # ── Python Setup ──
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # ── System Dependencies ──
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libespeak1 ffmpeg

      # ── Python Dependencies ──
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      # ── Download Trained Model ──
      - name: Download trained model artifact
        uses: actions/download-artifact@v4
        with:
          name: trained-model-${{ github.run_id }}
          path: models/

      # ── Evaluate ──
      - name: Run evaluation on new model
        run: |
          mkdir -p eval-results
          python scripts/evaluate.py \
            --weights models/best_accuracy_model.pth \
            --save-report eval-results/confusion_matrix.png \
            | tee eval-results/evaluation_log.txt
        env:
          PYTHONPATH: ${{ github.workspace }}

      # ── Upload Results ──
      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-eval-results-${{ github.run_id }}
          path: eval-results/
          retention-days: 90

      # ── Summary ──
      - name: Post retraining summary
        if: always()
        run: |
          echo "## 🔁 Retraining Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f eval-results/evaluation_log.txt ]; then
            echo "### Evaluation Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -25 eval-results/evaluation_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
