# ==============================================================================
# CircleCI Configuration — Sentry Vision AI Security System (FIXED)
# ==============================================================================

version: 2.1

# ------------------------------------
# Orbs
# ------------------------------------
orbs:
  python: circleci/python@2.1

# ------------------------------------
# Executors
# ------------------------------------
executors:
  python-executor:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/project
    resource_class: large
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"

# ------------------------------------
# Commands
# ------------------------------------
commands:
  install-system-deps:
    steps:
      - run:
          name: Install system dependencies
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              libgl1 \
              libglib2.0-0 \
              libespeak1 \
              ffmpeg
            sudo rm -rf /var/lib/apt/lists/*

  install-python-deps:
    steps:
      - restore_cache:
          keys:
            - pip-deps-v1-{{ checksum "requirements.txt" }}
            - pip-deps-v1-
      - run:
          name: Install Python dependencies
          command: |
            python -m pip install --upgrade pip setuptools wheel
            pip install -r requirements.txt
            pip install pytest pytest-cov pytest-asyncio httpx
      - save_cache:
          key: pip-deps-v1-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip

# ------------------------------------
# Jobs
# ------------------------------------

jobs:
  # =========================
  # TEST JOB
  # =========================
  test:
    executor: python-executor
    steps:
      - checkout
      - install-system-deps
      - install-python-deps

      - run:
          name: Run tests
          command: |
            python -m pytest tests/ \
              --verbose \
              --tb=short \
              --junitxml=test-results/junit.xml \
              --cov=src \
              --cov=backend \
              --cov-report=html:coverage-html \
              --cov-report=term-missing
          when: always

      - store_test_results:
          path: test-results

      - store_artifacts:
          path: coverage-html
          destination: coverage

  # =========================
  # DOCKER BUILD JOB (FIXED)
  # =========================
  build-docker:
    machine: true   # 🔥 FIX: avoids Docker API mismatch completely
    working_directory: ~/project
    steps:
      - checkout

      - run:
          name: Build Docker image
          command: |
            IMAGE_TAG="${CIRCLE_SHA1:0:7}"
            IMAGE_NAME="sentry-vision-ai-security-system"

            echo "Building ${IMAGE_NAME}:${IMAGE_TAG}"

            docker build \
              -t "${IMAGE_NAME}:${IMAGE_TAG}" \
              -t "${IMAGE_NAME}:latest" \
              --label "org.opencontainers.image.revision=${CIRCLE_SHA1}" \
              --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              .

            docker images "${IMAGE_NAME}"

# ------------------------------------
# Workflows
# ------------------------------------
workflows:
  version: 2

  build-and-test:
    jobs:
      - test

      - build-docker:
          requires:
            - test
          filters:
            branches:
              only:
                - main
                - master
                - develop